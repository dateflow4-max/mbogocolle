<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mbogo College</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<style>
:root{--ink:#0a0a0a;--paper:#ffffff;--bgc:#f2f4f2;--mut:#3b4540;--line:rgba(10,10,10,.12);--g:#16a34a;--g2:#4ade80;--red:#dc2626;--dk:#0a0a0a;--rc:#16a34a}
body.dark{--ink:#f4f5f4;--paper:#141816;--bgc:#0b0d0c;--mut:#c9d2cc;--line:rgba(255,255,255,.14);--dk:#202724;--g:#22c55e;--rc:#22c55e}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bgc);min-height:100vh;padding-bottom:96px;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;transition:background .5s,color .5s}
body.glassbg{background:#e9efea}
body.dark.glassbg{background:#0b0d0c}

/* splash: fly-in on every load */
#splash{position:fixed;inset:0;z-index:100;background:var(--bgc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:splashOut .8s cubic-bezier(.7,0,.3,1) 2.2s forwards;pointer-events:none}
.sp-logo{display:flex;align-items:flex-end;gap:10px;height:90px}
.sp-logo i{width:18px;border-radius:6px;background:var(--ink);animation:fly 1.2s cubic-bezier(.2,.8,.2,1) both}
.sp-logo i:nth-child(1){height:40px;animation-delay:.1s;--x:-140px;--y:-90px}
.sp-logo i:nth-child(2){height:62px;background:var(--g);animation-delay:.25s;--x:0px;--y:160px}
.sp-logo i:nth-child(3){height:90px;animation-delay:.4s;--x:150px;--y:-70px}
@keyframes fly{from{transform:translate(var(--x),var(--y)) scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.sp-word{font-weight:700;letter-spacing:-.04em;font-size:clamp(1.6rem,6vw,2.4rem);opacity:0;transform:translateY(16px);animation:wordIn .9s cubic-bezier(.2,.8,.2,1) 1.1s forwards}
@keyframes wordIn{to{opacity:1;transform:none}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}

/* liquid background: home and sign-in only */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;display:none;background:radial-gradient(120% 90% at 50% 0%,#fbfdfb,#dfe9e3)}
body.glassbg .bg{display:block}
body.dark .bg{background:radial-gradient(120% 90% at 50% 0%,#1a201d,#0b0d0c)}
.liquid{position:absolute;inset:-12%;filter:url(#goo)}
.liquid i{position:absolute;border-radius:50%;animation:float 14s ease-in-out infinite alternate}
.l1{width:44vmax;height:44vmax;left:-10vmax;top:-8vmax;background:var(--rc);animation-duration:16s}
.l2{width:36vmax;height:36vmax;right:-8vmax;top:28%;background:#16a34a;animation-duration:18s}
.l3{width:32vmax;height:32vmax;left:28%;bottom:-12vmax;background:#0a0a0a;animation-duration:20s}
.l4{width:22vmax;height:22vmax;left:8%;top:44%;background:#ffffff;animation-duration:12s}
.l5{width:20vmax;height:20vmax;right:18%;bottom:8%;background:var(--rc);animation-duration:22s}
@keyframes float{0%{transform:translate(0,0) scale(1)}50%{transform:translate(9vw,-7vh) scale(1.14)}100%{transform:translate(-7vw,9vh) scale(.9)}}
.spot{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(130px circle at var(--x,50%) var(--y,50%),rgba(255,255,255,.75),rgba(255,255,255,0) 70%)}
.glass{position:relative;overflow:hidden;background:rgba(255,255,255,.22);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid rgba(255,255,255,.6);border-radius:30px;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 40px 80px -44px rgba(0,0,0,.4);padding:22px}
body.dark .glass{background:rgba(20,24,22,.35);border-color:rgba(255,255,255,.12);color:var(--ink)}

/* controls */
button,.btn{position:relative;overflow:hidden;font:inherit;font-size:.9rem;border:0;cursor:pointer;border-radius:13px;padding:10px 16px;background:var(--ink);color:var(--paper);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .5s,box-shadow .3s,opacity .2s;box-shadow:0 6px 16px -10px rgba(10,10,10,.7);line-height:1.2}
@media(hover:hover){button:hover,.btn:hover{transform:translateY(-2px)}}
button:active,.btn:active{transform:scale(.96)}
button:disabled{opacity:.35;cursor:not-allowed}
.g{background:var(--g)!important;color:#fff!important;box-shadow:0 8px 18px -12px rgba(22,163,74,.9)}
.red{background:var(--red)!important;color:#fff!important;box-shadow:0 10px 22px -12px rgba(220,38,38,.9)}
.ghost{background:var(--paper)!important;color:var(--ink)!important;box-shadow:inset 0 0 0 1px var(--line)!important}
.sm{padding:7px 12px;font-size:.84rem;border-radius:11px}
.wide{width:100%}
.x{padding:0 6px;margin-left:4px;box-shadow:none;background:transparent!important;color:var(--mut)!important;font-size:1.05rem;line-height:1}
.ripple{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .7s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}
input,select,textarea{font:inherit;font-size:.96rem;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);outline:none;transition:box-shadow .3s,border-color .3s}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 4px rgba(22,163,74,.22);border-color:rgba(22,163,74,.5)}
input[type=checkbox]{width:auto}
input.num{width:76px;text-align:center;padding:8px}
input:disabled{opacity:.6}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-180%);transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:70;padding:12px 18px;border-radius:16px;font-size:.92rem;max-width:90vw;background:var(--ink);color:var(--paper)}
.toast.show{transform:translate(-50%,0)}

/* layout */
.wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:0 16px}
header.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;flex-wrap:wrap;transition:background .4s,padding .4s,box-shadow .4s}
header.min{background:var(--bgc);box-shadow:0 1px 0 var(--line);padding-top:10px;padding-bottom:10px}
body.glassbg header.bar{background:transparent}
body.glassbg header.min{box-shadow:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.logo{display:flex;align-items:flex-end;gap:3px;height:20px;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
header.min .logo{transform:scale(1.18)}
.logo i{width:5px;border-radius:2px;background:var(--ink)}
.logo i:nth-child(1){height:11px}.logo i:nth-child(2){height:16px;background:var(--g)}.logo i:nth-child(3){height:20px}
.word{display:inline-block;max-width:200px;overflow:hidden;white-space:nowrap;transition:max-width .6s cubic-bezier(.2,.8,.2,1),opacity .4s,transform .6s cubic-bezier(.2,.8,.2,1),color .6s}
header.min .word{max-width:0;opacity:0;transform:translateX(-22px)}
.sense{transition:color .6s cubic-bezier(.2,.8,.2,1)}
.sense.lit{color:#fff!important;text-shadow:0 1px 14px rgba(0,0,0,.35)}
#hdr{display:flex;gap:8px;align-items:center}
#tabs{display:none;position:relative;gap:2px;padding:5px;border-radius:22px;background:var(--paper);border:1px solid var(--line);box-shadow:0 18px 36px -22px rgba(10,10,10,.35);overflow-x:auto;max-width:100%}
#tabs button{position:relative;z-index:1;background:transparent!important;color:var(--ink);box-shadow:none;padding:9px 12px;font-size:.86rem;flex:1 0 auto;border-radius:16px;transition:color .4s;white-space:nowrap}
#tabs button:hover{transform:none}
#tabs button.on{color:var(--paper)}
.tind{position:absolute;top:5px;bottom:5px;left:0;border-radius:16px;background:var(--ink);transition:transform .55s cubic-bezier(.2,.8,.2,1),width .55s cubic-bezier(.2,.8,.2,1)}
@media(max-width:819px){#tabs{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(94vw,540px);z-index:30}*{scrollbar-width:none}*::-webkit-scrollbar{display:none}}
@media(min-width:820px){#tabs{margin-left:auto}}
body.glassbg #tabs{display:none!important}
.page{animation:up .7s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
.grid3{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
@media(min-width:820px){.grid2{grid-template-columns:1.1fr .9fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
h1{font-size:clamp(1.6rem,4.2vw,2.1rem);letter-spacing:-.03em;margin:0}
h2{font-size:1.12rem;letter-spacing:-.01em;margin:0 0 12px}
.label{font-size:.92rem;font-weight:700;color:var(--ink);opacity:.8;margin-bottom:6px;display:block}
.mut{color:var(--mut)}
.big{font-size:clamp(2.2rem,6vw,3rem);font-weight:700;letter-spacing:-.05em;line-height:1}
.lbl{display:block;font-size:.9rem;font-weight:600;color:var(--mut);margin:10px 0 6px}
.card{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 1px 2px rgba(10,10,10,.03);transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 22px 40px -26px rgba(10,10,10,.35)}}
.card.dark{background:var(--dk);color:#f4f5f4;border-color:transparent}
body.dark .card.dark{color:#f4f5f4}
.card.dark .mut,.card.dark .label{color:#d3dbd6}
.stat-g{background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;border-color:transparent}
.stat-g .label,.stat-g .mut{color:#fff}
.stat-k{background:#0a0a0a;color:#fff;border-color:transparent}
.stat-k .label,.stat-k .mut{color:#fff}
.stat-l{background:linear-gradient(135deg,#dcfce7,#86efac);color:#0a0a0a;border-color:transparent}
.strip{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-radius:16px;background:var(--paper);border:1px solid var(--line);margin-bottom:14px;font-size:.96rem;font-weight:500}
.latest{display:inline-flex;align-items:center;gap:6px;background:var(--g);color:#fff;font-weight:700;font-size:.85rem;padding:6px 12px;border-radius:99px;box-shadow:0 8px 18px -10px rgba(22,163,74,.9)}
.latest::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.due{color:var(--red);font-weight:700}
.chip{font-size:.78rem;font-weight:700;padding:5px 11px;border-radius:99px;background:rgba(10,10,10,.08);color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center}
.chip.g{background:rgba(22,163,74,.16);color:#0f7a36}
body.dark .chip.g{color:#86efac}
.chip.k{background:var(--ink);color:var(--paper)}
.chip.red{background:var(--red);color:#fff}
.chip.flag{background:var(--paper);color:#b42318;box-shadow:inset 0 0 0 1px #f3b7b0}
.rowline{padding:11px 0;border-bottom:1px solid var(--line)}
.bar2{height:9px;border-radius:99px;background:rgba(10,10,10,.1);overflow:hidden}
.bar2 i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--g),var(--g2));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar2 i.r{background:var(--red)}
.card.dark .bar2{background:rgba(255,255,255,.16)}
table{width:100%;border-collapse:collapse;font-size:.94rem}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
tr.hl:hover td{background:rgba(22,163,74,.07)}
th{font-size:.8rem;font-weight:700;color:var(--mut)}
.msg{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.gate{position:relative}
.blurred{filter:blur(8px);opacity:.55;pointer-events:none;user-select:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:12px}

/* report rail */
.rail{position:relative;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;margin:0 -16px;padding:4px 16px 16px}
.rail::-webkit-scrollbar{display:none}
.slide{flex:0 0 min(86vw,540px);scroll-snap-align:start;transform-origin:center;transition:box-shadow .4s;will-change:transform,opacity}
.slide .bar2 i{width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1) .15s}
.slide.in .bar2 i{width:var(--w)}
.dots{display:flex;gap:7px;justify-content:center;margin-top:6px}
.dot{width:8px;height:8px;border-radius:99px;background:rgba(10,10,10,.22);padding:0;box-shadow:none;transition:width .4s,background .4s}
.dot.on{width:24px;background:var(--g)}

/* calendar */
.wk{display:grid;grid-template-columns:repeat(7,1fr);font-size:.85rem;font-weight:700;color:var(--mut);margin:14px 0 6px;text-align:center}
.day{aspect-ratio:1;border-radius:14px;background:transparent;color:var(--ink);box-shadow:none;padding:0;font-weight:700;font-size:.95rem}
.day:hover{transform:none}
.day.has::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--g);margin:2px auto 0}
.day.on{background:var(--ink);color:var(--paper)}
.day.on::after{background:var(--g2)}

/* paper sheet: forms and circulars */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(10,10,10,.38);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:fadein .3s}
.sheet{position:relative;width:min(680px,100%);height:min(88vh,820px);background:var(--paper);color:var(--ink);border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:rise .55s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 60px -20px rgba(0,0,0,.4)}
@media(min-width:820px){.sheet-wrap{align-items:center}.sheet{border-radius:26px}}
.sheet-bar{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 8px}
.sheet-prog{height:3px;background:var(--line)}
.sheet-prog i{display:block;height:100%;width:0;background:var(--g);transition:width .2s}
.paper{flex:1;min-height:0;overflow:auto;padding:22px 26px;font-family:Georgia,"Times New Roman",serif;font-size:1.04rem;line-height:1.75}
.paper h2{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:1.4rem}
.sheet-foot{padding:14px 20px 20px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.sheet-foot:empty{display:none}
.sheet-foot input{font-size:1rem}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@keyframes fadein{from{opacity:0}}

/* home */
.home-wrap{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;padding:20px}
.hglass{width:min(390px,100%);padding:36px 24px;text-align:center}
.hglass h1{font-size:clamp(2.2rem,8vw,3.1rem);letter-spacing:-.05em;margin:0 0 26px;line-height:.95}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cta .btn{min-width:124px;padding:12px 18px}

/* sign in and sign up */
.auth{max-width:420px;margin:16px auto;padding:22px}
.seg{position:relative;display:grid;padding:5px;border-radius:999px;background:rgba(255,255,255,.6);overflow:hidden}
body.dark .seg{background:rgba(255,255,255,.08)}
.blobs{position:absolute;inset:5px;filter:url(#goo);pointer-events:none}
.blob{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--g);transition:background .6s cubic-bezier(.2,.8,.2,1)}
.seg button{position:relative;z-index:1;background:transparent!important;color:var(--ink);box-shadow:none;padding:11px 4px;font-size:.95rem;transition:color .5s;border-radius:999px}
.seg button:hover{transform:none}
.seg button.on{color:#fff}
.seg button.on.office{color:#0a0a0a}
.field{position:relative;margin-top:12px}
.pw{margin-top:56px}
.mascot{position:absolute;right:14px;top:-56px;width:64px;height:62px;z-index:1;transition:transform .7s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.mascot.hide{transform:translateY(42px)}
.mascot svg{width:100%;height:100%;overflow:visible}
.mascot .ey{fill:#0a0a0a;transform-box:fill-box;transform-origin:center;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.mascot.hide .ey{transform:scaleY(.08)}
.shield{position:absolute;inset:0;z-index:2;border-radius:14px;background:rgba(255,255,255,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.85);opacity:0;pointer-events:none;transition:opacity .45s cubic-bezier(.2,.8,.2,1)}
.shield.on{opacity:1}
.pwi{padding-right:72px}
.pwt{position:absolute;right:7px;top:50%;transform:translateY(-50%);padding:7px 11px;font-size:.8rem;border-radius:10px;box-shadow:none;z-index:3}
.err{color:#b42318;min-height:1.3em;font-size:.92rem;margin:10px 0 0}
.link{display:block;text-align:center;margin-top:12px;color:var(--mut);font-size:.92rem;text-decoration:none;font-weight:600}

/* forms list */
.drop{display:flex;flex-direction:column;gap:4px;align-items:center;border:1.5px dashed var(--line);border-radius:22px;padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .3s,background .3s}
.drop.over{border-color:var(--g);background:rgba(22,163,74,.1)}
.circ{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer}
.circ:hover .circ-t{text-decoration:underline}
.circ-t{font-weight:700;font-size:1.02rem}

@media print{
  #tabs,#hdr,.noprint,.bg,.spot,header.bar,.dots,.toast,#splash{display:none!important}
  body{background:#fff;padding:0;color:#000}
  body.one *{visibility:hidden}
  body.one .printing,body.one .printing *{visibility:visible}
  body.one .rail{overflow:visible;margin:0;padding:0;display:block}
  body.one .printing{position:absolute;left:0;top:0;width:100%;max-width:none;transform:none!important;opacity:1!important;box-shadow:none;border:0}
}

/* crest logo */
.crest{width:46px;height:46px;object-fit:contain;border-radius:50%;background:#fff;box-shadow:0 4px 14px -6px rgba(0,0,0,.35);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
header.min .crest{transform:scale(.86)}
.home-crest{width:118px;height:118px;object-fit:contain;border-radius:50%;background:#fff;display:block;margin:0 auto 16px;box-shadow:0 14px 30px -14px rgba(0,0,0,.35);animation:up .9s cubic-bezier(.2,.8,.2,1)}
.sp-img{width:150px;height:150px;object-fit:contain;border-radius:50%;background:#fff;box-shadow:0 18px 40px -18px rgba(0,0,0,.4);--x:0px;--y:-90px;animation:fly 1.3s cubic-bezier(.2,.8,.2,1) both}

/* friendly errors and feedback */
.field input.bad{border-color:#dc2626;box-shadow:0 0 0 4px rgba(220,38,38,.18);animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.auth.shake{animation:shake .5s}
.auth.leave{transform:translateY(-28px) scale(.96);opacity:0;transition:transform .45s cubic-bezier(.7,0,.3,1),opacity .45s}
.err{display:flex;gap:10px;align-items:flex-start;border-radius:14px;color:#b42318;font-size:.93rem;font-weight:600;margin-top:10px}
.err:empty{display:none}
.err.pop{padding:10px 12px;background:rgba(220,38,38,.1);animation:pop .4s cubic-bezier(.2,.8,.2,1)}
.err-ic{width:22px;height:22px;border-radius:50%;background:#dc2626;color:#fff;display:inline-grid;place-items:center;flex:0 0 22px;font-weight:800;font-size:.85rem}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:none;opacity:1}}
button.busy{pointer-events:none}
button.busy::after{content:"";display:inline-block;width:14px;height:14px;margin-left:8px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* home crest: hover and click */
#hcrest{cursor:pointer;transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s}
@media(hover:hover){#hcrest:hover{transform:scale(1.08);box-shadow:0 22px 44px -16px rgba(22,163,74,.55)}}
#hcrest.zoom{animation:zoomPop .75s cubic-bezier(.2,.8,.2,1)}
@keyframes zoomPop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
.cta .btn.glow{animation:glow 1s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(22,163,74,.75)}55%{box-shadow:0 0 0 20px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}

/* teacher marks validation */
.err-box{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 14px;background:rgba(220,38,38,.12);border:1.5px solid rgba(220,38,38,.3);color:#b42318;font-size:.92rem;font-weight:600}
.err-box.pop{animation:pop .4s cubic-bezier(.2,.8,.2,1)}
.mark-card.shake{animation:shake .5s}
tr.missing-mark{background:rgba(220,38,38,.08)}
tr.missing-mark input{border-color:#dc2626;animation:pulse-border 1.5s ease-in-out infinite}
tr.zero-warn{background:rgba(251,191,36,.08)}
tr.zero-warn input{border-color:#f59e0b}
@keyframes pulse-border{0%,100%{border-color:#dc2626}50%{border-color:#f87171}}

</style>

}

    const lo=Math.min(from,i),span=Math.abs(i-from)+1;

      {left:`calc(${lo*100/n}% + 2px)`,width:`calc(${span*100/n}% - 4px)`,offset:.5},
      {left:segPos(i,n).left,width:segPos(i,n).width}
    ],{duration:720,easing:'cubic-bezier(.2,.8,.2,1)'});
  }
  const p=segPos(i,n);
  b.style.left=p.left;b.style.width=p.width;b.style.background=COL[to];

function fields(mode,role){
  const f=$('#fields');
  const name=mode==='signup'?`<div class="field"><input name="name" placeholder="Full name" autocomplete="name"></div>`:'';
  let codes='';
  if(mode==='signup'&&role==='parent')codes=`<div class="field"><input name="pc" placeholder="Parent code" autocomplete="off"></div><div class="field"><input name="sc" placeholder="Student code" autocomplete="off"></div>`;
  if(mode==='signup'&&role==='teacher')codes=`<div class="field"><input name="tc" placeholder="Teacher code" autocomplete="off"></div>`;
  f.innerHTML=`${name}
  <div class="field"><input name="phone" id="ph" type="tel" inputmode="tel" placeholder="Phone number" autocomplete="tel"></div>
  <div class="field pw">
    <div class="mascot hide" id="mas">${MASCOT}</div>
    <input name="pw" id="pw" type="password" class="pwi" placeholder="Password" autocomplete="${mode==='signin'?'current-password':'new-password'}">
    <div class="shield on" id="shield"></div>
    <button type="button" class="pwt" id="pwt">Show</button>
  </div>${codes}`;
  const pw=$('#pw'),pt=$('#pwt'),mas=$('#mas'),sh=$('#shield');
  pt.onclick=()=>{const show=pw.type==='password';pw.type=show?'text':'password';pt.textContent=show?'Hide':'Show';mas.classList.toggle('hide',!show);sh.classList.toggle('on',!show);};
  const card=$('.auth');
  const E=(m,bad=[])=>{
    const el=$('#err');
    el.innerHTML=m?`<span class="err-ic">!</span><span>${m}</span>`:'';
    el.classList.remove('pop');void el.offsetWidth;if(m)el.classList.add('pop');
    $$('#f .bad').forEach(x=>x.classList.remove('bad'));
    bad.forEach(n=>{const x=$(`#f [name="${n}"]`);if(x)x.classList.add('bad');});
    if(m){card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
      const first=bad[0]&&$(`#f [name="${bad[0]}"]`);if(first)first.focus();}
  };
  const busy=(on,label)=>{
    const b=$('#f button[type=submit]');
    b.disabled=on;b.classList.toggle('busy',on);
    b.textContent=on?label:(mode==='signup'?'Create account':'Sign in');
  };
  const leave=then=>{card.classList.add('leave');setTimeout(then,460);};
  $('#f').onsubmit=e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData($('#f')));
    const phone=(d.phone||'').trim(),pass=d.pw||'';
    if(mode==='signin'){
      const missing=[!phone&&'phone',!pass&&'pw'].filter(Boolean);
      if(missing.length)return E('Add your phone number and password to continue.',missing);
      busy(true,'Signing in');
      setTimeout(()=>{
        const a=DB.accounts.find(x=>x.phone===phone&&x.pw===pass);
        if(!a){busy(false);return E("Phone or password doesn't match. Check both and try again.",['phone','pw']);}
        if(a.role!==role){busy(false);return E(`This phone belongs to a ${ROLE_LABEL[a.role]} account. Choose ${ROLE_LABEL[a.role]} to sign in.`,['phone']);}
        DB.session=phone;save();leave(()=>go(a.role));
      },650);
      return;
    }
    const missing=[!d.name&&'name',!phone&&'phone',!pass&&'pw'].filter(Boolean);
    if(missing.length)return E('Add your name, phone number and password to continue.',missing);
    if(DB.accounts.some(x=>x.phone===phone))return E('That phone already has an account. Try signing in instead.',['phone']);
    let kids=[],status='active';
    if(role==='parent'){
      const pc=(d.pc||'').trim().toUpperCase(),sc=(d.sc||'').trim().toUpperCase();
      const missingC=[!pc&&'pc',!sc&&'sc'].filter(Boolean);
      if(missingC.length)return E('Enter the parent code and the student code from the school.',missingC);
      const kid=DB.kids.find(k=>k.id===sc&&k.pcode===pc);
      if(!kid)return E("We couldn't match those codes to a student. Check them with the school office.",['pc','sc']);
      kids=[kid.id];
    }else{
      const tc=(d.tc||'').trim().toUpperCase();
      if(!tc)return E('Enter the teacher code from the school office.',['tc']);
      if(tc!==DB.teacherCode)return E("That teacher code isn't right. Ask the school office for the current code.",['tc']);
      status='pending';
    }
    busy(true,'Creating account');
    setTimeout(()=>{
      DB.accounts.push({name:d.name.trim(),phone,pw:pass,role,kids,assign:[],status});
      DB.session=phone;save();
      leave(()=>go(role));
    },650);
  };
}

function openPaper(o){
  const w=document.createElement('div');

  w.innerHTML=`<div class="sheet-bg"></div><div class="sheet" role="dialog">
    <div class="sheet-bar"><span class="label" style="margin:0">${esc(o.kicker)}</span><button class="ghost sm" data-x>Close</button></div>
    <div class="sheet-prog"><i></i></div>
    <div class="paper"><h2>${esc(o.title)}</h2>${o.body}</div>
    <div class="sheet-foot" id="foot"></div></div>`;
  document.body.appendChild(w);
  const close=()=>w.remove();
  w.querySelector('[data-x]').onclick=close;
  w.querySelector('.sheet-bg').onclick=close;
  const paper=w.querySelector('.paper'),bar=w.querySelector('.sheet-prog i'),foot=w.querySelector('#foot');
  const showFoot=()=>{
    if(foot.dataset.on)return;
    foot.dataset.on='1';
    if(o.sign){
      foot.innerHTML=`<input id="sig" placeholder="Type your full name to sign">
        <div class="row"><button class="g" id="ok" style="flex:1">Approve</button><button class="red" id="no" style="flex:1">Decline</button></div>`;
      foot.querySelector('#ok').onclick=()=>{
        const n=foot.querySelector('#sig').value.trim();
        if(!n)return toast('Type your name to sign');
        if(!o.check(n))return toast('Name must match your account');
        o.onApprove(n);close();
      };
      foot.querySelector('#no').onclick=()=>{o.onDecline();close();};
    }else{
      foot.innerHTML=`<button class="g wide" id="done">Done</button>`;
      foot.querySelector('#done').onclick=close;
    }
  };
  const check=()=>{
    const max=paper.scrollHeight-paper.clientHeight;
    const p=max>0?paper.scrollTop/max:1;
    bar.style.width=(p*100)+'%';
    if(p>.97)showFoot();
  };
  paper.addEventListener('scroll',check,{passive:true});
  requestAnimationFrame(check);
}

function railInit(rail){
  const slides=[...rail.children],dots=$$('.dots [data-d]');
  const update=()=>{
    const rc=rail.getBoundingClientRect(),mid=rc.left+rc.width/2;
    let best=0,bd=1e9;
    slides.forEach((s,j)=>{
      const r=s.getBoundingClientRect(),d=Math.min(Math.abs(r.left+r.width/2-mid)/rc.width,1);
      s.style.transform=`scale(${1-d*.07})`;s.style.opacity=1-d*.55;
      if(d<bd){bd=d;best=j;}
    });
    dots.forEach((x,j)=>x.classList.toggle('on',j===best));
  };
  rail.addEventListener('scroll',()=>requestAnimationFrame(update),{passive:true});
  dots.forEach((d,j)=>d.onclick=()=>rail.scrollTo({left:slides[j].offsetLeft-rail.offsetLeft-16,behavior:'smooth'}));
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.55)e.target.classList.add('in');}),{root:rail,threshold:[0,.55,1]});
  slides.forEach(s=>io.observe(s));
  update();
  $$('[data-print]').forEach(b=>b.onclick=()=>{const s=b.closest('.slide');document.body.classList.add('one');s.classList.add('printing');window.print();});
}
window.addEventListener('afterprint',()=>{document.body.classList.remove('one');$$('.printing').forEach(x=>x.classList.remove('printing'));});

function marksView(a){

    const c=DB.classes.find(x=>x.id===cls);
    if(!c)return '';
    const done=DB.subm[c.id+':'+CUR+':'+subj];
    const kids=classKids(c);
    const missing=kids.filter(k=>scoreOf(k,CUR,subj)==null&&!DB.absent[k.id+':'+CUR+':'+subj]);
    const zeros=kids.filter(k=>scoreOf(k,CUR,subj)===0&&!DB.zeroConfirm[k.id+':'+CUR+':'+subj]);
    return `<div class="card mark-card" style="margin-bottom:14px" data-cid="${c.id}" data-subj="${subj}">

          <td><input class="num" type="number" min="0" max="100" data-score="${k.id}|${subj}" value="${score??''}" ${done||isAbsent?'disabled':''} placeholder="${isAbsent?'Absent':'0-100'}"></td>

      }).join('')||'<tr><td colspan="3" class="mut">No students yet.</td></tr>'}</table></div>

    </div>`;

function decisionOf(k){
  if(DB.decisions[k.id])return DB.decisions[k.id];
  const c=classOf(k),last=pubTerms(k).slice(-1)[0];
  const a=last!=null?avgT(k,last):null;

  return a==null||a>=50?'promote':'repeat';
}
function feeTotals(){

  return {K,collected,due:expected-collected,expected};
}

    body=`<div class="grid3">
      <div class="card stat-g" data-go="students" style="cursor:pointer"><span class="label">Students</span><div class="big" style="margin-top:8px"><span data-n="${K.length}">0</span></div><div style="font-weight:600;margin-top:6px">Tap to view</div></div>
      <div class="card stat-k" data-fees style="cursor:pointer"><span class="label">Fees collected</span><div class="big" style="margin-top:8px;font-size:clamp(1.4rem,4vw,2rem)">${money(collected)}</div><div style="font-weight:600;margin-top:6px">${money(due)} due · tap</div></div>
      <div class="card stat-l" data-go="staff" style="cursor:pointer"><span class="label">Needs you</span><div class="big" style="margin-top:8px"><span data-n="${sent.length+pending.length}">0</span></div><div style="font-weight:600;margin-top:6px">${pending.length} to approve</div></div>
    </div>
    <div class="card" style="margin-top:14px"><h2>Classes · ${TERMS[CUR]}</h2>
      ${DB.classes.map(c=>{const st=DB.rstat[c.id+':'+CUR]||'open',ct=classTeacher(c);return `<div class="rowline row sp"><div><div style="font-weight:600">${esc(c.name)}</div><div class="mut" style="font-size:.9rem">${ct?'Class teacher: '+esc(ct.name):'No class teacher yet'}</div></div><span class="chip ${st==='published'?'g':st==='sent'?'k':''}">${st==='published'?'Published':st==='sent'?'Awaiting review':'In progress'}</span></div>`;}).join('')}
    </div>
    <div class="card" style="margin-top:14px"><div class="row sp"><h2 style="margin:0">Report opened</h2><span class="chip">${published.length-notOpened.length} of ${published.length} families</span></div>
      <p class="mut" style="margin:10px 0 0">${notOpened.length?'Not opened yet: '+notOpened.map(k=>esc(k.name)).join(', '):'Every family has opened their report.'}</p>
    </div>`;
  }else if(U.otab==='students'){
    const classOpts=`<option value="">All classes</option>`+DB.classes.map(c=>`<option value="${c.id}" ${U.stc===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
    const payOpts=`<option value="">All payment status</option><option value="paid" ${U.stpay==='paid'?'selected':''}>Fully paid</option><option value="unpaid" ${U.stpay==='unpaid'?'selected':''}>Has balance due</option>`;
    const statusOpts=`<option value="">All status</option><option value="active" ${U.ststat==='active'?'selected':''}>Active</option><option value="inactive" ${U.ststat==='inactive'?'selected':''}>Inactive</option>`;
    body=`<div class="card">
      <div class="row" style="margin-bottom:12px;gap:8px;flex-wrap:wrap">
        <input id="stq" placeholder="Search by name or code" value="${esc(U.stq)}" style="flex:2;min-width:180px">
        <select id="stc" style="flex:1;min-width:140px">${classOpts}</select>
        <select id="stpay" style="flex:1;min-width:160px">${payOpts}</select>
        <select id="ststat" style="flex:1;min-width:130px">${statusOpts}</select>
        <button class="ghost sm" id="strclear">Clear filters</button>
      </div>
      <div id="stcount" style="margin-bottom:10px"></div>
      <div id="stlist"></div>
      <div id="stpag" style="margin-top:14px"></div>
    </div>`;
  }else if(U.otab==='staff'){
    const classOpts=DB.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
    const roleOpts=`<option value="">Class teacher</option>`+DB.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
    const approved=DB.accounts.filter(x=>x.role==='teacher'&&x.status!=='pending');
    const parents=DB.accounts.filter(x=>x.role==='parent');
    body=`<div class="card" style="border:2px solid var(--g)"><h2>Waiting for approval · ${pending.length}</h2>
      ${pending.length?pending.map(t=>`<div class="rowline row sp"><div><div style="font-weight:700">${esc(t.name)}</div><div class="mut" style="font-size:.9rem">${t.phone} · signed up with the teacher code</div></div><button class="g sm" data-approve="${t.phone}">Approve</button></div>`).join(''):'<p class="mut">Nobody is waiting.</p>'}</div>
    <div class="grid2" style="margin-top:14px">
    <div class="card"><h2>Add a teacher or office staff</h2>
      <input id="os-name" placeholder="Full name" style="margin-bottom:8px"><input id="os-phone" placeholder="Phone number" style="margin-bottom:8px"><input id="os-pw" type="password" placeholder="Password" style="margin-bottom:8px">
      <select id="os-role" style="margin-bottom:10px"><option value="teacher">Teacher</option><option value="office">Office</option></select>
      <button class="wide" id="addstaff">Add staff</button></div>
    <div class="card"><h2>Teacher code</h2><div class="row sp"><span style="font-family:ui-monospace,monospace;font-size:1.2rem;font-weight:700">${esc(DB.teacherCode)}</span><button class="ghost sm" id="newcode">New code</button></div></div>
    </div>
    <div class="card" style="margin-top:14px"><h2>Teachers</h2>${approved.map(t=>`<div class="rowline">
      <div style="font-weight:600">${esc(t.name)} <span class="mut" style="font-size:.9rem">${t.phone}</span></div>
      <div class="row" style="margin:8px 0">${(t.assign||[]).map((x,i)=>`<span class="chip ${x.subj?'':'k'}">${esc(classNameOf(x.cls))} · ${x.subj?esc(subjName(x.subj)):'Class teacher'}<button class="x" data-unassign="${t.phone}|${i}">×</button></span>`).join('')||'<span class="mut" style="font-size:.9rem">No assignments</span>'}</div>
      <div class="row"><select data-cls-for="${t.phone}" style="width:auto;padding:8px 10px;font-size:.9rem">${classOpts}</select><select data-role-for="${t.phone}" style="width:auto;padding:8px 10px;font-size:.9rem">${roleOpts}</select><button class="sm" data-assign="${t.phone}">Assign</button></div>
    </div>`).join('')||'<p class="mut">No approved teachers yet.</p>'}</div>
    <div class="grid2" style="margin-top:14px">
    <div class="card"><h2>Link a student to a parent</h2>
      <select id="lk-parent" style="margin-bottom:8px">${parents.map(p=>`<option value="${p.phone}">${esc(p.name)}</option>`).join('')}</select>
      <select id="lk-kid" style="margin-bottom:10px">${ALL.map(k=>`<option value="${k.id}">${esc(k.name)}</option>`).join('')}</select>
      <button class="wide" id="linkkid">Link</button></div>
    <div class="card"><h2>Classes</h2>${DB.classes.map(c=>`<div class="rowline"><div class="row sp"><b>${esc(c.name)}</b><span class="mut" style="font-size:.9rem">${classKids(c).length} students</span></div></div>`).join('')}
      <div class="row" style="margin-top:12px"><input id="newcls" placeholder="New class name" style="flex:1"><button class="sm" id="mkcls">Create class</button></div></div>
    </div>`;
  }else if(U.otab==='review'){
    body=sent.length?sent.map(c=>{
      const kids=classKids(c);
      const avgs=c.subj.map(s=>{const v=kids.map(k=>scoreOf(k,CUR,s)).filter(x=>x!=null);return `<tr><td>${esc(subjName(s))}</td><td>${v.length?Math.round(v.reduce((x,y)=>x+y,0)/v.length):'–'}%</td></tr>`;}).join('');
      return `<div class="card" style="margin-bottom:14px"><div class="row sp"><div><span class="label">${esc(c.name)} · ${TERMS[CUR]}</span><h2 style="margin:4px 0 0">${kids.length} reports</h2></div><span class="chip k">Ready to publish</span></div>
        <table style="margin-top:10px">${avgs}</table>
        <div class="row" style="margin-top:16px"><button class="g" data-publish="${c.id}">Approve & publish to families</button><button class="ghost sm" data-return="${c.id}">Return to class teacher</button></div></div>`;
    }).join(''):`<div class="card"><h2>Nothing to review</h2><p class="mut">Class reports appear here when a class teacher sends them.</p></div>`;
  }else if(U.otab==='circ'){
    body=`<div class="grid2">
    <div class="card"><h2>New circular</h2>
      <input id="ci-title" placeholder="Title" style="margin-bottom:8px">
      <label class="lbl">Event date (optional)</label><input id="ci-date" type="date" style="margin-bottom:8px">
      <textarea id="ci-body" rows="6" placeholder="Message to parents" style="margin-bottom:8px"></textarea>
      <label class="drop" id="ci-drop" style="padding:18px"><input type="file" id="ci-file" hidden accept=".pdf,.doc,.docx,image/*"><span style="font-weight:700" id="ci-file-name">Attach a file</span></label>
      <button class="g wide" id="ci-publish" style="margin-top:12px">Publish to parents</button></div>
    <div class="card"><h2>Published</h2>${DB.circulars.map(c=>`<div class="rowline row sp"><div><div style="font-weight:700">${esc(c.title)}</div><div class="mut" style="font-size:.9rem">${esc(c.posted)}${c.date?' · '+fmtDate(c.date):''}</div></div><button class="ghost sm" data-delcirc="${c.id}">Remove</button></div>`).join('')||'<p class="mut">No circulars yet.</p>'}</div>
    </div>`;
  }else if(U.otab==='requests'){
    const inbox=open.length?open.map(i=>`<div class="msg"><span class="chip ${i.type==='absence'?'flag':'k'}">${i.type}</span><div style="flex:1"><div style="font-weight:600">${esc(kidBy(i.kid).name)} · ${esc(i.text)}</div><div class="mut" style="font-size:.88rem">${i.d}</div></div><button class="ghost sm" data-done="${i.id}">Done</button></div>`).join(''):'<p class="mut">Inbox clear.</p>';
    const slipRows=DB.slips.map(s=>{const yes=K.filter(k=>(DB.consents[k.id+':'+s.id]||{}).status==='yes').length;return `<tr class="hl"><td>${esc(s.title)}</td><td>${yes} / ${K.length} approved</td></tr>`;}).join('');
    const medRows=K.filter(k=>DB.med[k.id]).map(k=>`<tr class="hl"><td>${esc(k.name)}</td><td>${esc(DB.med[k.id].allergies||'None')}</td><td>${esc(DB.med[k.id].emergency||'')}</td></tr>`).join('')||'<tr><td colspan="3" class="mut">No updates yet.</td></tr>';
    body=`<div class="grid2"><div class="card"><h2>Inbox</h2>${inbox}</div><div class="card"><h2>Permission slips</h2><table>${slipRows}</table></div></div>
    <div class="card" style="margin-top:14px"><h2>Medical updates</h2><div style="overflow-x:auto"><table><tr><th>Student</th><th>Allergies</th><th>Emergency</th></tr>${medRows}</table></div></div>`;
  }else{
    const counts={promote:0,repeat:0,graduate:0};
    const yr=K.map(k=>{const d=decisionOf(k);counts[d]=(counts[d]||0)+1;return `<tr class="hl"><td>${esc(k.name)}</td><td>${esc(classOf(k).name)}</td><td>${avgT(k,CUR)??avgT(k,1)??'–'}%</td><td><select data-dec="${k.id}">${[['promote','Promote to next class'],['repeat','Repeat this class'],['graduate','Graduate'],['transfer','Transfer out']].map(([v,l])=>`<option value="${v}" ${d===v?'selected':''}>${l}</option>`).join('')}</select></td></tr>`;}).join('');
    body=`<div class="card"><div class="row sp" style="margin-bottom:10px"><h2 style="margin:0">Year-end · ${DB.acadYear}</h2><span class="chip">${counts.promote||0} promote · ${counts.repeat||0} repeat · ${counts.graduate||0} graduate</span></div>
      <p class="mut" style="margin:0 0 12px">Closing the year moves each student to their next class and records the year in their history.</p>
      <div style="overflow-x:auto"><table><tr><th>Student</th><th>Class</th><th>Latest avg</th><th>Decision</th></tr>${yr}</table></div>
      <button class="g wide" id="closeyear" style="margin-top:16px">${U.armYear?'Tap again to close the year':'Close the year and move students'}</button></div>`;
  }
  page(`<div class="head"><div><div class="label">School office · ${DB.acadYear}</div><h1>${titles[U.otab]}</h1></div></div>${body}`);
  afterRender();
  bindOffice(a,published);
}
function drawStudents(){
  const list=$('#stlist');
  if(!list)return;
  const q=U.stq.toLowerCase();
  const PER_PAGE=20;
  if(!U.stpage)U.stpage=1;
  
  let rows=DB.kids.filter(k=>{
    if(U.stc&&k.classId!==U.stc)return false;
    if(U.stpay==='paid'&&k.paid<k.total)return false;
    if(U.stpay==='unpaid'&&k.paid>=k.total)return false;
    if(U.ststat&&k.status!==U.ststat)return false;
    if(q&&!k.name.toLowerCase().includes(q)&&!k.id.toLowerCase().includes(q))return false;
    return true;
  });
  
  const total=rows.length;
  const pages=Math.ceil(total/PER_PAGE)||1;
  if(U.stpage>pages)U.stpage=pages;
  const start=(U.stpage-1)*PER_PAGE;
  const end=start+PER_PAGE;
  const page=rows.slice(start,end);
  
  const count=$('#stcount');
  if(count)count.innerHTML=`<div class="row sp"><span class="label">Showing ${start+1}–${Math.min(end,total)} of ${total} students</span><span class="mut" style="font-size:.9rem">Page ${U.stpage} of ${pages}</span></div>`;
  
  list.innerHTML=`<div style="overflow-x:auto"><table><tr><th>Student</th><th>Class</th><th>Fees</th><th>Status</th></tr>${page.map(k=>`<tr class="hl" data-profile="${k.id}" style="cursor:pointer"><td style="font-weight:600">${esc(k.name)}<div class="mut" style="font-size:.85rem">${k.id}</div></td><td>${esc(classNameOf(k.classId))}</td><td>${k.paid>=k.total?'<span class="chip g">Paid</span>':`<span class="due">${money(k.total-k.paid)} due</span>`}</td><td><span class="chip ${k.status==='active'?'':'mut'}">${esc(k.status)}</span></td></tr>`).join('')||'<tr><td colspan="4" class="mut">No students match.</td></tr>'}</table></div>`;
  
  const pag=$('#stpag');
  if(pag&&pages>1){
    const btns=[];
    if(U.stpage>1)btns.push(`<button class="sm ghost" data-pg="${U.stpage-1}">← Previous</button>`);
    btns.push(`<span class="mut" style="padding:0 12px">Page ${U.stpage} of ${pages}</span>`);
    if(U.stpage<pages)btns.push(`<button class="sm ghost" data-pg="${U.stpage+1}">Next →</button>`);
    pag.innerHTML=`<div class="row" style="justify-content:center">${btns.join('')}</div>`;
    pag.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{U.stpage=+b.dataset.pg;drawStudents();});
  }else if(pag){
    pag.innerHTML='';
  }
  
  list.querySelectorAll('[data-profile]').forEach(r=>r.onclick=()=>profileSheet(r.dataset.profile));
}
function bindOffice(a,published){
  drawStudents();
  $$('[data-go]').forEach(el=>el.onclick=()=>{U.otab=el.dataset.go;route();});
  const fees=$('[data-fees]');
  if(fees)fees.onclick=()=>feeSheet();
  const sq=$('#stq');
  if(sq){
    sq.oninput=()=>{U.stq=sq.value;U.stpage=1;drawStudents();};
    const stc=$('#stc');
    if(stc)stc.onchange=e=>{U.stc=e.target.value;U.stpage=1;drawStudents();};
    const stpay=$('#stpay');
    if(stpay)stpay.onchange=e=>{U.stpay=e.target.value;U.stpage=1;drawStudents();};
    const ststat=$('#ststat');
    if(ststat)ststat.onchange=e=>{U.ststat=e.target.value;U.stpage=1;drawStudents();};
    const strclear=$('#strclear');
    if(strclear)strclear.onclick=()=>{U.stq='';U.stc='';U.stpay='';U.ststat='';U.stpage=1;route();};
  }
  $$('[data-dec]').forEach(s=>s.onchange=()=>{DB.decisions[s.dataset.dec]=s.value;save();toast('Decision saved');});
  const cy=$('#closeyear');
  if(cy)cy.onclick=()=>{
    if(!U.armYear){U.armYear=true;route();setTimeout(()=>{U.armYear=false;if(U.otab==='yearend')route();},4000);return;}
    U.armYear=false;closeYear();
  };
  $$('[data-done]').forEach(b=>b.onclick=()=>{const it=DB.inbox.find(x=>String(x.id)===b.dataset.done);if(it)it.done=true;save();route();});
  $$('[data-publish]').forEach(b=>b.onclick=()=>{
    const c=DB.classes.find(x=>x.id===b.dataset.publish);
    const kids=classKids(c);
    kids.forEach(k=>{k.pub[CUR]=1;});
    const ranked=kids.map(k=>({k,a:avgOf(k,CUR,c.subj)??0})).sort((x,y)=>y.a-x.a);
    ranked.forEach((r,i)=>{r.k.pos[CUR]=i+1;});
    kids.forEach(k=>DB.msgs.unshift({ch:'App',kid:k.id,t:`${TERMS[CUR]} report card is ready`,d:'Just now'}));
    DB.rstat[c.id+':'+CUR]='published';save();toast(c.name+' published');route();
  });
  $$('[data-return]').forEach(b=>b.onclick=()=>{const c=DB.classes.find(x=>x.id===b.dataset.return);DB.rstat[c.id+':'+CUR]='open';save();toast('Returned to class teacher');route();});
  $$('[data-approve]').forEach(b=>b.onclick=()=>{const t=DB.accounts.find(x=>x.phone===b.dataset.approve);t.status='active';t.assign=t.assign||[];save();toast(t.name+' approved');route();});
  $$('[data-assign]').forEach(b=>b.onclick=()=>{
    const t=DB.accounts.find(x=>x.phone===b.dataset.assign);
    const cls=document.querySelector(`[data-cls-for="${t.phone}"]`).value;
    const role=document.querySelector(`[data-role-for="${t.phone}"]`).value||null;
    const c=DB.classes.find(x=>x.id===cls);
    t.assign=t.assign||[];
    if(role===null){
      DB.accounts.forEach(x=>{if(x.assign)x.assign=x.assign.filter(y=>!(y.cls===cls&&!y.subj));});
      t.assign.push({cls,subj:null});
    }else{
      if(!c.subj.includes(role))c.subj.push(role);
      DB.accounts.forEach(x=>{if(x.assign)x.assign=x.assign.filter(y=>!(y.cls===cls&&y.subj===role));});
      t.assign.push({cls,subj:role});
    }
    save();toast('Assigned');route();
  });
  $$('[data-unassign]').forEach(b=>b.onclick=()=>{const [ph,i]=b.dataset.unassign.split('|');const t=DB.accounts.find(x=>x.phone===ph);t.assign.splice(+i,1);save();toast('Removed');route();});
  const nc=$('#newcode');
  if(nc)nc.onclick=()=>{DB.teacherCode='GREEN-'+Math.floor(1000+Math.random()*8999);save();toast('New teacher code set');route();};
  const ast=$('#addstaff');
  if(ast)ast.onclick=()=>{
    const name=$('#os-name').value.trim(),phone=$('#os-phone').value.trim(),pw=$('#os-pw').value,role=$('#os-role').value;
    if(!name||!phone||!pw)return toast('Fill in every field');
    if(DB.accounts.some(x=>x.phone===phone))return toast('This phone already has an account');
    DB.accounts.push({name,phone,pw,role,status:'active',assign:[],kids:[]});save();toast(ROLE_LABEL[role]+' account added');route();
  };
  const lk=$('#linkkid');
  if(lk)lk.onclick=()=>{
    const p=DB.accounts.find(x=>x.phone===$('#lk-parent').value),kid=$('#lk-kid').value;
    if(!p)return toast('No parent accounts yet');
    p.kids=p.kids||[];
    if(p.kids.includes(kid))return toast('Already linked');
    p.kids.push(kid);save();toast('Student linked');route();
  };
  const mk=$('#mkcls');
  if(mk)mk.onclick=()=>{const n=$('#newcls').value.trim();if(!n)return toast('Enter a class name');DB.classes.push({id:'C'+Date.now(),name:n,subj:[]});save();toast('Class created');route();};
  const sd=$('#send');
  if(sd)sd.onclick=()=>{
    const ch=['App','SMS','WhatsApp'].filter((c,i)=>$('#c'+(i+1)).checked);
    if(!ch.length)return toast('Choose a channel');
    published.forEach(k=>ch.forEach(c=>DB.msgs.unshift({ch:c,kid:k.id,t:'Term 3 report card is ready',d:'Just now'})));
    save();toast('Notified '+published.length+' families');route();
  };
  const cf=$('#ci-file');
  if(cf){
    let pendingFile=null;
    cf.onchange=()=>{pendingFile=cf.files[0]||null;$('#ci-file-name').textContent=pendingFile?pendingFile.name:'Attach a file';};
    const drop=$('#ci-drop');
    drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
    drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
    drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files[0]){pendingFile=e.dataTransfer.files[0];$('#ci-file-name').textContent=pendingFile.name;}});
    $('#ci-publish').onclick=()=>{
      const title=$('#ci-title').value.trim(),body=$('#ci-body').value.trim(),date=$('#ci-date').value;
      if(!title||!body)return toast('Add a title and a message');
      DB.circulars.unshift({id:'CI'+Date.now(),title,body,posted:'Posted today',date:date||null});
      if(date)DB.events.push({date,title,where:'School'});
      DB.events.sort((x,y)=>x.date.localeCompare(y.date));
      save();toast('Circular published to parents');route();
    };
  }
  $$('[data-delcirc]').forEach(b=>b.onclick=()=>{DB.circulars=DB.circulars.filter(c=>c.id!==b.dataset.delcirc);save();toast('Removed');route();});
}
function closeYear(){
  const K=DB.kids.filter(k=>k.status==='active');
  K.forEach(k=>{
    const c=classOf(k);if(!c)return;
    const d=decisionOf(k);
    const last=pubTerms(k).slice(-1)[0];
    const avg=last!=null?avgT(k,last):null;
    k.history.push({year:DB.acadYear,cls:c.name,avg,decision:d==='promote'?'Promoted':d==='repeat'?'Repeated':d==='graduate'?'Graduated':'Transferred'});
    let to=c.id,status='active';
    if(d==='promote'&&NEXT[c.id])to=NEXT[c.id];
    if(d==='promote'&&!NEXT[c.id]){status='graduated';}
    if(d==='graduate')status='graduated';
    if(d==='transfer')status='transferred';
    k.classId=to;k.status=status;
    k.promo={year:DB.acadYear+1,from:c.name,to:classNameOf(to),decision:d};
    k.marks=[{},{},{}];k.pub=[0,0,0];k.pos=[0,0];k.rem=['','',''];k.paid=0;k.total=k.total;
    if(status==='active')DB.msgs.unshift({ch:'App',kid:k.id,t:`Promoted to ${classNameOf(to)} for ${DB.acadYear+1}`,d:'Just now'});
  });
  DB.acadYear+=1;DB.decisions={};DB.subm={};DB.rstat={};DB.opened={};
  save();toast('Year closed · students moved');route();
}

/* ===== start ===== */
route();

</script>
</body>
