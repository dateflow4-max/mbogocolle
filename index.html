<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mbogo College</title>
<style>
:root{--ink:#0a0a0a;--mut:#5f6661;--g:#16a34a;--g2:#4ade80;--red:#dc2626;--line:rgba(10,10,10,.09);--rc:#16a34a}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#f2f4f2;min-height:100vh;padding-bottom:96px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.glassbg{background:#e9efea}
#splash{position:fixed;inset:0;z-index:100;background:#f2f4f2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:splashOut .8s cubic-bezier(.7,0,.3,1) 2.2s forwards;pointer-events:none}
.sp-logo{display:flex;align-items:flex-end;gap:10px;height:90px}
.sp-logo i{width:18px;border-radius:6px;background:var(--ink);animation:fly 1.2s cubic-bezier(.2,.8,.2,1) both}
.sp-logo i:nth-child(1){height:40px;animation-delay:.1s;--x:-140px;--y:-90px}
.sp-logo i:nth-child(2){height:62px;background:var(--g);animation-delay:.25s;--x:0px;--y:160px}
.sp-logo i:nth-child(3){height:90px;animation-delay:.4s;--x:150px;--y:-70px}
@keyframes fly{from{transform:translate(var(--x),var(--y)) scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.sp-word{font-weight:700;letter-spacing:-.04em;font-size:clamp(1.6rem,6vw,2.4rem);opacity:0;transform:translateY(16px);animation:wordIn .9s cubic-bezier(.2,.8,.2,1) 1.1s forwards}
@keyframes wordIn{to{opacity:1;transform:none}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;display:none;background:radial-gradient(120% 90% at 50% 0%,#fbfdfb,#dfe9e3)}
body.glassbg .bg{display:block}
.liquid{position:absolute;inset:-12%;filter:url(#goo)}
.liquid i{position:absolute;border-radius:50%;animation:float 14s ease-in-out infinite alternate}
.l1{width:44vmax;height:44vmax;left:-10vmax;top:-8vmax;background:var(--rc);animation-duration:16s}
.l2{width:36vmax;height:36vmax;right:-8vmax;top:28%;background:#16a34a;animation-duration:18s}
.l3{width:32vmax;height:32vmax;left:28%;bottom:-12vmax;background:#0a0a0a;animation-duration:20s}
.l4{width:22vmax;height:22vmax;left:8%;top:44%;background:#ffffff;animation-duration:12s}
.l5{width:20vmax;height:20vmax;right:18%;bottom:8%;background:var(--rc);animation-duration:22s}
@keyframes float{0%{transform:translate(0,0) scale(1)}50%{transform:translate(9vw,-7vh) scale(1.14)}100%{transform:translate(-7vw,9vh) scale(.9)}}
.spot{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(130px circle at var(--x,50%) var(--y,50%),rgba(255,255,255,.75),rgba(255,255,255,0) 70%)}
button,.btn{position:relative;overflow:hidden;font:inherit;font-size:.88rem;border:0;cursor:pointer;border-radius:13px;padding:10px 16px;background:var(--ink);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .5s,box-shadow .3s,opacity .2s;box-shadow:0 6px 16px -10px rgba(10,10,10,.7);line-height:1.2}
@media(hover:hover){button:hover,.btn:hover{transform:translateY(-2px)}}
button:active,.btn:active{transform:scale(.96)}
button:disabled{opacity:.35;cursor:not-allowed}
.g{background:var(--g)!important;box-shadow:0 8px 18px -12px rgba(22,163,74,.9)}
.red{background:var(--red)!important;box-shadow:0 10px 22px -12px rgba(220,38,38,.9)}
.ghost{background:#fff!important;color:var(--ink)!important;box-shadow:inset 0 0 0 1px var(--line)!important}
.sm{padding:7px 12px;font-size:.82rem;border-radius:11px}
.wide{width:100%}
.x{padding:0 6px;margin-left:4px;box-shadow:none;background:transparent!important;color:var(--mut)!important;font-size:1rem;line-height:1}
.ripple{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .7s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}
.wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:0 16px}
header.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;flex-wrap:wrap;transition:background .4s,padding .4s,box-shadow .4s}
header.min{background:rgba(243,245,243,.97);box-shadow:0 1px 0 var(--line);padding-top:10px;padding-bottom:10px}
body.glassbg header.bar{background:transparent}
body.glassbg header.min{background:transparent;box-shadow:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.logo{display:flex;align-items:flex-end;gap:3px;height:20px;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
header.min .logo{transform:scale(1.18)}
.logo i{width:5px;border-radius:2px;background:var(--ink)}
.logo i:nth-child(1){height:11px}.logo i:nth-child(2){height:16px;background:var(--g)}.logo i:nth-child(3){height:20px}
.word{display:inline-block;max-width:200px;overflow:hidden;white-space:nowrap;transition:max-width .6s cubic-bezier(.2,.8,.2,1),opacity .4s,transform .6s cubic-bezier(.2,.8,.2,1),color .6s}
header.min .word{max-width:0;opacity:0;transform:translateX(-22px)}
.sense{transition:color .6s cubic-bezier(.2,.8,.2,1)}
.sense.lit{color:#fff!important;text-shadow:0 1px 14px rgba(0,0,0,.35)}
#hdr{display:flex;gap:8px;align-items:center}
#tabs{display:none;position:relative;gap:2px;padding:5px;border-radius:22px;background:#fff;border:1px solid var(--line);box-shadow:0 18px 36px -22px rgba(10,10,10,.35)}
#tabs button{position:relative;z-index:1;background:transparent!important;color:var(--ink);box-shadow:none;padding:8px 10px;font-size:.82rem;flex:1;border-radius:16px;transition:color .4s;white-space:nowrap}
#tabs button:hover{transform:none}
#tabs button.on{color:#fff}
.tind{position:absolute;top:5px;bottom:5px;left:0;border-radius:16px;background:var(--ink);transition:transform .55s cubic-bezier(.2,.8,.2,1),width .55s cubic-bezier(.2,.8,.2,1)}
@media(max-width:819px){#tabs{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(94vw,520px);z-index:30;overflow-x:auto}*{scrollbar-width:none}*::-webkit-scrollbar{display:none}}
@media(min-width:820px){#tabs{margin-left:auto}}
body.glassbg #tabs,body.glassbg #hdr{display:none!important}
.glass{position:relative;overflow:hidden;background:rgba(255,255,255,.22);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid rgba(255,255,255,.6);border-radius:30px;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 40px 80px -44px rgba(0,0,0,.4);padding:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 1px 2px rgba(10,10,10,.03);transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 22px 40px -26px rgba(10,10,10,.35)}}
.card.dark{background:var(--ink);color:#f4f5f4;border-color:transparent}
.dark .mut{color:#a7b1ab}
.stat-g{background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;border-color:transparent}
.stat-g .eyebrow{color:rgba(255,255,255,.85)}
.stat-k{background:var(--ink);color:#fff;border-color:transparent}
.stat-k .eyebrow{color:#a7b1ab}
.stat-l{background:linear-gradient(135deg,#dcfce7,#86efac);border-color:transparent}
.mut{color:var(--mut)}
.eyebrow{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.big{font-size:clamp(2rem,6vw,2.9rem);font-weight:700;letter-spacing:-.05em;line-height:1}
h1{font-size:clamp(1.5rem,4vw,2rem);letter-spacing:-.03em;margin:0}
h2{font-size:1.02rem;letter-spacing:-.01em;margin:0 0 12px}
.lbl{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 6px}
.latest{display:inline-flex;align-items:center;gap:6px;background:var(--g);color:#fff;font-weight:700;font-size:.8rem;padding:6px 12px;border-radius:99px;box-shadow:0 8px 18px -10px rgba(22,163,74,.9)}
.latest::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.due{color:var(--red);font-weight:700}
.chip.red{background:var(--red);color:#fff}
.strip{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-radius:16px;background:#fff;border:1px solid var(--line);margin-bottom:14px;font-size:.92rem}
.page{animation:up .7s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
.grid3{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
@media(min-width:820px){.grid2{grid-template-columns:1.1fr .9fr}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.chip{font-size:.7rem;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(10,10,10,.07);white-space:nowrap;display:inline-flex;align-items:center}
.chip.g{background:rgba(22,163,74,.14);color:#0f7a36}
.chip.k{background:var(--ink);color:#fff}
.chip.flag{background:#fff;color:#b42318;box-shadow:inset 0 0 0 1px #f3b7b0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.rowline{padding:10px 0;border-bottom:1px solid var(--line)}
.bar2{height:8px;border-radius:99px;background:rgba(10,10,10,.08);overflow:hidden}
.bar2 i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--g),var(--g2));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar2 i.r{background:var(--red)}
.dark .bar2{background:rgba(255,255,255,.14)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
tr.hl:hover td{background:rgba(22,163,74,.05)}
th{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
input,select,textarea{font:inherit;font-size:.95rem;width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(10,10,10,.1);background:#fff;color:var(--ink);outline:none;transition:box-shadow .3s,border-color .3s}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 4px rgba(22,163,74,.18);border-color:rgba(22,163,74,.5)}
input[type=checkbox]{width:auto}
input.num{width:74px;text-align:center;padding:8px}
input:disabled{background:#f5f6f5;color:var(--mut)}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-180%);transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:50;padding:12px 18px;border-radius:16px;font-size:.9rem;max-width:90vw;background:var(--ink);color:#fff}
.toast.show{transform:translate(-50%,0)}
.home-wrap{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;padding:20px}
.hglass{width:min(390px,100%);padding:36px 24px;text-align:center}
.hglass h1{font-size:clamp(2.2rem,8vw,3.1rem);letter-spacing:-.05em;margin:0 0 26px;line-height:.95}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cta .btn{min-width:124px;padding:12px 18px}
.auth{max-width:410px;margin:16px auto;padding:22px}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:5px;border-radius:999px;background:rgba(255,255,255,.55);overflow:hidden}
.blobs{position:absolute;inset:5px;filter:url(#goo);pointer-events:none}
.blob{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--g);transition:background .6s cubic-bezier(.2,.8,.2,1)}
.seg button{position:relative;z-index:1;background:transparent!important;color:var(--ink);box-shadow:none;padding:10px 4px;font-size:.9rem;transition:color .5s;border-radius:999px}
.seg button:hover{transform:none}
.seg button.on{color:#fff}
#seg[data-r=office] button.on{color:var(--ink)}
#seg[data-r=office] .blob{box-shadow:inset 0 0 0 1px rgba(10,10,10,.14)}
.field{position:relative;margin-top:12px}
.pw{margin-top:56px}
.mascot{position:absolute;right:14px;top:-56px;width:64px;height:62px;z-index:1;transition:transform .7s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.mascot.hide{transform:translateY(42px)}
.mascot svg{width:100%;height:100%;overflow:visible}
.mascot .ey{fill:var(--ink);transform-box:fill-box;transform-origin:center;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.mascot.hide .ey{transform:scaleY(.08)}
.shield{position:absolute;inset:0;z-index:2;border-radius:14px;background:rgba(255,255,255,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.85);opacity:0;pointer-events:none;transition:opacity .45s cubic-bezier(.2,.8,.2,1)}
.shield.on{opacity:1}
.pwi{padding-right:70px}
.pwt{position:absolute;right:7px;top:50%;transform:translateY(-50%);padding:7px 11px;font-size:.78rem;border-radius:10px;box-shadow:none;background:var(--ink);z-index:3}
.fill{margin-top:8px;padding:6px 11px;font-size:.78rem;border-radius:99px;background:rgba(22,163,74,.14);color:#0f7a36;box-shadow:none;display:none}
.fill.on{display:inline-flex;animation:up .4s cubic-bezier(.2,.8,.2,1)}
.err{color:#b42318;min-height:1.3em;font-size:.86rem;margin:10px 0 0}
.link{display:block;text-align:center;margin-top:12px;color:var(--mut);font-size:.86rem;text-decoration:none}
.rail{position:relative;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;margin:0 -16px;padding:4px 16px 16px}
.rail::-webkit-scrollbar{display:none}
.slide{flex:0 0 min(86vw,540px);scroll-snap-align:start;transform-origin:center;transition:box-shadow .4s;will-change:transform,opacity}
.slide .bar2 i{width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1) .15s}
.slide.in .bar2 i{width:var(--w)}
.dots{display:flex;gap:7px;justify-content:center;margin-top:6px}
.dot{width:7px;height:7px;border-radius:99px;background:rgba(10,10,10,.18);padding:0;box-shadow:none;transition:width .4s,background .4s}
.dot.on{width:22px;background:var(--g)}
.msg{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.gate{position:relative}
.blurred{filter:blur(8px);opacity:.55;pointer-events:none;user-select:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:12px}
@media print{
  #tabs,#hdr,.noprint,.bg,.spot,header.bar,.dots,.toast,#splash{display:none!important}
  body{background:#fff;padding:0}
  body.one *{visibility:hidden}
  body.one .printing,body.one .printing *{visibility:visible}
  body.one .rail{overflow:visible;margin:0;padding:0;display:block}
  body.one .printing{position:absolute;left:0;top:0;width:100%;max-width:none;transform:none!important;opacity:1!important;box-shadow:none;border:0}
}
</style>
</head>

const $=s=>document.querySelector(s);

const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const classKids=c=>DB.kids.filter(k=>k.classId===c.id);

const scoreOf=(k,t,s)=>(k.marks[t]||{})[s];
const avgOf=(k,t,subs)=>{const v=subs.map(s=>scoreOf(k,t,s)).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null;};

const pubTerms=k=>[0,1,2].filter(t=>k.pub[t]);
const daysToEnd=()=>Math.max(0,Math.ceil((new Date(TERM_END)-new Date('2026-11-26'))/86400000));
const classTeacher=c=>DB.accounts.find(a=>a.role==='teacher'&&(a.assign||[]).some(x=>x.cls===c.id&&!x.subj));
const subjTeacher=(c,s)=>DB.accounts.find(a=>a.role==='teacher'&&(a.assign||[]).some(x=>x.cls===c.id&&x.subj===s));
const U={tab:'report',role:'parent',blobIdx:null,kid:null,ttab:'marks',otab:'overview'};
const go=p=>{location.hash='#'+p;};

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}
function tabs(items,key){
  const n=$('#tabs');
  if(!items.length){n.style.display='none';n.innerHTML='';return;}
  if(!items.some(([k])=>k===U[key]))U[key]=items[0][0];
  n.innerHTML=`<span class="tind" id="tind"></span>`+items.map(([k,l])=>`<button data-t="${k}" class="${U[key]===k?'on':''}">${l}</button>`).join('');
  n.style.display='flex';
  n.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{U[key]=b.dataset.t;route();});
  const on=n.querySelector('.on'),ind=n.querySelector('#tind');
  requestAnimationFrame(()=>{ind.style.width=on.offsetWidth+'px';ind.style.transform=`translateX(${on.offsetLeft}px)`;});
}
function hdr(){
  const a=me();
  $('#hdr').innerHTML=a?`<button class="ghost sm" id="so">Sign out</button>`:`<a class="btn sm ghost" href="#signin">Sign in</a><a class="btn sm g" href="#signup">Sign up</a>`;

function page(html){$('#app').innerHTML=`<div class="page">${html}</div>`;}
function route(){
  const r=(location.hash||'#home').slice(1)||'home';
  const a=me();
  document.body.classList.toggle('glassbg',['home','signup','signin'].includes(r));
  document.documentElement.style.setProperty('--rc',COL[(a&&a.role)||U.role]||COL.parent);
  tabs([],'tab');hdr();
  if(['parent','teacher','office'].includes(r)){
    if(!a)return go('signin');
    if(a.role!==r)return go(a.role);
  }
  if(r==='signup')return authPage('signup');
  if(r==='signin')return authPage('signin');
  if(r==='parent')return parentPortal(a);
  if(r==='teacher')return teacherPortal(a);
  if(r==='office')return officePortal(a);
  return homePage();
}
window.addEventListener('hashchange',()=>{window.scrollTo(0,0);route();});
window.addEventListener('scroll',()=>{const h=$('header.bar');if(h)h.classList.toggle('min',window.scrollY>24);const b=$('.liquid');if(b&&!rb.active)b.style.transform=`translateY(${-window.scrollY*0.18}px)`;},{passive:true});
window.addEventListener('online',route);
window.addEventListener('offline',route);

/* light that follows the cursor; a small flash on touch */
let spotT;
const spot=()=>$('#spot');
function lightAt(x,y,o){const s=spot();if(!s)return;s.style.setProperty('--x',x+'px');s.style.setProperty('--y',y+'px');s.style.opacity=o;}
document.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')lightAt(e.clientX,e.clientY,.7);});
document.addEventListener('pointerleave',()=>{if(spot())spot().style.opacity=0;});
document.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'){lightAt(e.clientX,e.clientY,.7);return;}
  lightAt(e.clientX,e.clientY,.32);
  clearTimeout(spotT);spotT=setTimeout(()=>{if(spot())spot().style.opacity=0;},600);
});
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('button,.btn');if(!b||b.disabled)return;
  const r=b.getBoundingClientRect(),s=document.createElement('span');
  s.className='ripple';s.style.left=(e.clientX-r.left)+'px';s.style.top=(e.clientY-r.top)+'px';
  b.appendChild(s);setTimeout(()=>s.remove(),700);haptic();
});

/* rubber-band scroll with pull-to-refresh */
const rb={y0:null,active:false,p:0};
const rbEase='transform .9s cubic-bezier(.34,1.56,.64,1)';
function rubberSet(p){rb.p=p;const pg=$('#app .page'),b=$('.liquid');if(pg){pg.style.transition='none';pg.style.transform=`translateY(${p}px)`;}if(b){b.style.transition='none';b.style.transform=`translateY(${-window.scrollY*0.18+p*0.5}px)`;}}
function rubberRelease(){const pg=$('#app .page'),b=$('.liquid');if(pg){pg.style.transition=rbEase;pg.style.transform='translateY(0)';setTimeout(()=>pg.style.transition='',950);}if(b){b.style.transition=rbEase;b.style.transform=`translateY(${-window.scrollY*0.18}px)`;setTimeout(()=>b.style.transition='',950);}}
window.addEventListener('touchstart',e=>{rb.y0=e.touches[0].clientY;rb.active=false;},{passive:true});
window.addEventListener('touchmove',e=>{if(rb.y0==null)return;const dy=e.touches[0].clientY-rb.y0;const atTop=window.scrollY<=0,atBottom=window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-2;if((atTop&&dy>0)||(atBottom&&dy<0)){rb.active=true;rubberSet(dy*0.35/(1+Math.abs(dy)/400));e.preventDefault();}},{passive:false});
window.addEventListener('touchend',()=>{
  if(rb.active){const refresh=rb.p>60&&!document.body.classList.contains('glassbg');rubberRelease();if(refresh){toast('Updated');setTimeout(route,300);}}
  rb.y0=null;rb.active=false;
});

/* wordmark turns white while a dark blob passes behind it */
function senseLoop(){
  const els=$$('.sense');
  if(!els.length||!document.body.classList.contains('glassbg')){window._sense=0;return;}
  const dk=$('.liquid .dk');
  if(dk){
    const d=dk.getBoundingClientRect();
    els.forEach(el=>{
      const r=el.getBoundingClientRect();
      el.classList.toggle('lit',r.left<d.right&&r.right>d.left&&r.top<d.bottom&&r.bottom>d.top);
    });
  }
  requestAnimationFrame(senseLoop);
}
function startSense(){if(!window._sense){window._sense=1;requestAnimationFrame(senseLoop);}}

/* ---------- AUTH ---------- */
function authPage(mode){
  page(`<div class="auth glass">
  ${mode==='signup'?`<div class="seg" id="seg" data-r="${U.role}"><div class="blobs"><div class="blob" id="blob"></div></div>${ROLES.map(([k,l])=>`<button type="button" data-role="${k}" class="${U.role===k?'on':''}">${l}</button>`).join('')}</div>`:''}
  <form id="f" style="margin-top:${mode==='signup'?'16px':'2px'}"><div id="fields"></div><p class="err" id="err"></p>
  <button class="g wide" type="submit" style="margin-top:12px">${mode==='signup'?'Create account':'Sign in'}</button></form>
  <a class="link" href="#${mode==='signup'?'signin':'signup'}">${mode==='signup'?'I have an account':'Create an account'}</a></div>`);
  if(mode==='signup'){
    placeBlob(U.role,false);
    $$('#seg [data-role]').forEach(b=>b.onclick=()=>{
      const to=b.dataset.role;if(to===U.role)return;
      placeBlob(to,true);U.role=to;
      $('#seg').dataset.r=to;
      document.documentElement.style.setProperty('--rc',COL[to]);
      $$('#seg [data-role]').forEach(x=>x.classList.toggle('on',x.dataset.role===to));
      fields(mode,to);
    });
  }
  fields(mode,U.role);
}
function blobPos(i){return {left:`calc(${i*100/3}% + 2px)`,width:`calc(${100/3}% - 4px)`};}
function placeBlob(to,anim){
  const b=$('#blob');
  const i=ROLES.findIndex(r=>r[0]===to);
  const from=U.blobIdx==null?i:U.blobIdx;
  if(anim&&from!==i){
    const lo=Math.min(from,i),span=Math.abs(i-from)+1;
    b.animate([
      {left:blobPos(from).left,width:blobPos(from).width},
      {left:`calc(${lo*100/3}% + 2px)`,width:`calc(${span*100/3}% - 4px)`,offset:.5},
      {left:blobPos(i).left,width:blobPos(i).width}
    ],{duration:720,easing:'cubic-bezier(.2,.8,.2,1)'});
  }
  const p=blobPos(i);
  b.style.left=p.left;b.style.width=p.width;b.style.background=COL[to];
  U.blobIdx=i;
}
function fields(mode,role){
  const f=$('#fields');
  const codes=mode==='signin'?'':role==='parent'
    ?`<div class="field"><input name="pc" placeholder="Parent code" autocomplete="off"></div><div class="field"><input name="sc" placeholder="Student code" autocomplete="off"></div>`
    :`<div class="field"><input name="sc" placeholder="Staff code" autocomplete="off"></div>`;
  f.innerHTML=`${mode==='signin'?'':`<div class="field"><input name="name" placeholder="Full name" autocomplete="name"></div>`}
  <div class="field"><input name="phone" id="ph" type="tel" inputmode="tel" placeholder="Phone number" autocomplete="tel"><button type="button" class="fill" id="fill">Use saved number</button></div>
  <div class="field pw">
    <div class="mascot hide" id="mas">${MASCOT}</div>
    <input name="pw" id="pw" type="password" class="pwi" placeholder="Password" autocomplete="${mode==='signin'?'current-password':'new-password'}">
    <div class="shield on" id="shield"></div>
    <button type="button" class="pwt" id="pwt">Show</button>
  </div>
  ${codes}`;
  const ph=$('#ph'),fl=$('#fill');
  ph.onfocus=()=>{if(!ph.value)fl.classList.add('on');};
  ph.oninput=()=>fl.classList.toggle('on',!ph.value);
  ph.onblur=()=>setTimeout(()=>fl.classList.remove('on'),150);
  fl.onclick=()=>{ph.value='0700000001';fl.classList.remove('on');};
  const pw=$('#pw'),pt=$('#pwt'),mas=$('#mas'),sh=$('#shield');
  pt.onclick=()=>{
    const show=pw.type==='password';
    pw.type=show?'text':'password';
    pt.textContent=show?'Hide':'Show';
    mas.classList.toggle('hide',!show);
    sh.classList.toggle('on',!show);
  };
  $('#f').onsubmit=e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData($('#f')));
    const E=m=>$('#err').textContent=m;
    const phone=(d.phone||'').trim(),pass=d.pw||'';
    if(mode==='signin'){
      const a=DB.accounts.find(x=>x.phone===phone&&x.pw===pass);
      if(!a)return E('Phone or password is incorrect');
      DB.session=phone;save();return go(a.role);
    }
    if(!d.name||!phone||!pass)return E('Fill in every field');
    let kid=null;
    if(role==='parent'){
      kid=DB.kids.find(k=>k.id===(d.sc||'').trim().toUpperCase()&&k.pcode===(d.pc||'').trim().toUpperCase());
      if(!kid)return E("Those codes don't match a student");
    }else if((d.sc||'').trim()!==STAFF_CODE)return E('Staff code not recognised');
    if(DB.accounts.some(x=>x.phone===phone))return E('This phone already has an account');
    DB.accounts.push({name:d.name.trim(),phone,pw:pass,role,kids:kid?[kid.id]:[],assign:[],status:role==='teacher'?'pending':'active'});
    DB.session=phone;save();go(role);
  };
}

/* ---------- PARENT ---------- */
function parentPortal(a){
  const ids=myKids(a);
  if(!U.kid||!ids.includes(U.kid))U.kid=ids[0];
  const k=kidBy(U.kid);
  if(!k){page(`<div class="card"><h2>No child linked</h2><p class="mut">Add a child with your codes below.</p></div>`+addChild());bindAddChild(a);return;}
  const c=classOf(k);
  const due=k.paid<k.total;
  tabs([['report','Reports'],['fees','Fees'],['forms','Forms'],['cal','Calendar'],['msgs','Messages']],'tab');
  const locked=due&&U.tab==='report';
  if(U.tab==='report'&&!locked){DB.opened[k.id]=true;save();}
  const views={msgs:()=>pMsgs(k),fees:()=>pFees(k),forms:()=>pForms(k),cal:()=>pCal(k)};
  const body=locked?pGate(k):(views[U.tab]?views[U.tab]():pReport(k));
  const switcher=ids.length>1?`<div class="row">${ids.map(id=>`<button class="sm ${id===k.id?'':'ghost'}" data-kid="${id}">${esc(kidBy(id).name.split(' ')[0])}</button>`).join('')}</div>`:'';
  page(`<div class="head"><div><div class="eyebrow">${esc(c.name)}</div><h1>${esc(k.name)}</h1></div>
    <div class="row">${switcher}<span class="chip ${due?'red':'g'}">${due?'Fees due':'Fees paid'}</span>${navigator.onLine?'':'<span class="chip">Offline · saved copy</span>'}</div></div>
    ${body}${addChild()}`);
  $$('[data-kid]').forEach(b=>b.onclick=()=>{U.kid=b.dataset.kid;route();});
  bindAddChild(a);
  const v=$('#verify');
  if(v)v.onclick=()=>{DB.payments.push({id:Date.now(),kid:k.id,amt:k.total-k.paid,d:'Just now',via:'SchoolPay'});k.paid=k.total;save();toast('Payment confirmed');route();};
  bindParent(k);
  afterRender();
}
function addChild(){
  return `<div class="card" style="margin-top:14px"><h2>Add a child</h2><div class="row"><input id="pc2" placeholder="Parent code" style="flex:1;min-width:120px"><input id="sc2" placeholder="Student code" style="flex:1;min-width:120px"><button class="sm" id="addkid">Add</button></div></div>`;
}
function bindAddChild(a){
  const b=$('#addkid');if(!b)return;
  b.onclick=()=>{
    const pc=$('#pc2').value.trim().toUpperCase(),sc=$('#sc2').value.trim().toUpperCase();
    const kid=DB.kids.find(x=>x.id===sc&&x.pcode===pc);
    if(!kid)return toast("Those codes don't match a student");
    if(myKids(a).includes(kid.id))return toast('Already linked');
    a.kids=[...myKids(a),kid.id];save();U.kid=kid.id;toast(kid.name.split(' ')[0]+' added');route();
  };
}
function afterRender(){
  $$('[data-n]').forEach(el=>{
    const to=+el.dataset.n,suf=el.dataset.s||'',t0=performance.now();
    const tick=t=>{const p=Math.min((t-t0)/900,1),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e)+suf;if(p<1)requestAnimationFrame(tick);};
    requestAnimationFrame(tick);
  });
  const rail=$('#rail');
  if(rail)railInit(rail);
  const pb=$$('.bar2 i[data-w]');
  requestAnimationFrame(()=>setTimeout(()=>pb.forEach(i=>i.style.width=i.dataset.w+'%'),80));
}
function pGate(k){
  const bal=k.total-k.paid,first=k.name.split(' ')[0];
  return `<div class="gate"><div class="blurred card">${[62,71,58,80,66,74].map(v=>`<div style="margin:18px 0"><div class="bar2"><i style="width:${v}%"></i></div></div>`).join('')}</div>
  <div class="overlay"><div class="card dark" style="max-width:420px;width:100%">
    <div class="eyebrow">Report locked</div>
    <h2 style="font-size:1.3rem;margin:8px 0 0">Pay to see ${esc(first)}'s report</h2>
    <div class="row sp" style="margin-top:18px"><div><div class="mut">Balance due</div><div class="big due" style="font-size:1.8rem;margin-top:4px;color:#ff6b6b">${money(bal)}</div></div>
    <div style="text-align:right"><div class="mut">SchoolPay code</div><div style="font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--g2);font-size:1.05rem;letter-spacing:.06em;margin-top:4px">${esc(k.spc)}</div></div></div>
    <button class="red wide" id="verify" style="margin-top:20px">Pay ${money(bal)} now</button>
  </div></div></div>`;
}
function pReport(k){
  const c=classOf(k),subs=c.subj;
  const pt=pubTerms(k).reverse();
  if(!pt.length)return `<div class="card"><div class="eyebrow">Term 3</div><h2 style="margin-top:8px">Not ready yet</h2><p class="mut">Your child's report appears here when the school publishes it.</p></div>`;
  const last=pt[0],lastA=avgT(k,last);
  const gap=lastA==null?0:Math.max(0,GOAL-lastA);
  const cards=pt.map((t,j)=>{
    const a=avgOf(k,t,subs),pv=pt[j+1]!=null?pt[j+1]:null,pa=pv!=null?avgT(k,pv):null;
    const scored=subs.map(s=>({s,v:scoreOf(k,t,s)})).filter(x=>x.v!=null);
    const best=scored.reduce((m,x)=>x.v>m.v?x:m,scored[0]||{v:0,s:''});
    const low=scored.reduce((m,x)=>x.v<m.v?x:m,scored[0]||{v:0,s:''});
    return `<article class="slide card">
      <div class="row sp">${j===0?'<span class="latest">Latest · '+TERMS[t]+'</span>':`<span class="eyebrow">${TERMS[t]}</span>`}${pa!=null?`<span class="chip ${a>=pa?'g':'red'}">${a>=pa?'▲':'▼'} ${Math.abs(a-pa)} pts</span>`:''}</div>
      <div class="big" style="margin:16px 0 4px"><span data-n="${a}" data-s="%">0%</span></div>
      <div class="mut">Grade ${gradeOf(a)} · Position ${k.pos[t]??'–'} of ${classKids(c).length}</div>
      <div style="margin-top:18px">${subs.map(s=>{const v=scoreOf(k,t,s);return v==null?'':`<div style="margin-bottom:12px"><div class="row sp" style="font-size:.9rem;margin-bottom:6px"><span>${subjName(s)}</span><span>${v}%</span></div><div class="bar2"><i class="${v<50?'r':''}" data-w="${v}" style="--w:${v}%"></i></div></div>`;}).join('')}</div>
      <div class="grid2" style="gap:10px;margin-top:6px"><div class="card" style="padding:12px;box-shadow:none"><div class="eyebrow">Strongest</div><div style="margin-top:4px">${esc(subjName(best.s))}</div></div><div class="card" style="padding:12px;box-shadow:none"><div class="eyebrow">Work on</div><div class="due" style="margin-top:4px">${esc(subjName(low.s))}</div></div></div>
      <p class="mut" style="margin:14px 0 12px">“${esc(k.rem[t]||'')}”</p>
      <div class="row sp noprint"><span></span><button class="ghost sm" data-print="${j}">Print</button></div>
    </article>`;
  }).join('');
  return `<div class="strip"><span>${TERM_END?'Term 3 ends in <b>'+daysToEnd()+' days</b>':''}</span><span class="mut">${pt.length>=3?'All reports in':'Next: Term 3 report'}</span></div>
  <div class="card dark" style="margin-bottom:14px">
    <div class="row sp"><div><div class="eyebrow">Average · ${TERMS[last]}</div><div class="big" style="margin-top:8px"><span data-n="${lastA??0}" data-s="%">0%</span></div></div>
    <div style="text-align:right"><div class="eyebrow">Position</div><div style="font-size:1.6rem;font-weight:700;margin-top:6px">${k.pos[last]??'–'}</div></div></div>
    <div style="margin-top:16px"><div class="row sp" style="font-size:.85rem"><span>Goal ${GOAL}%</span><span>${gap?gap+' pts to go':'Goal reached'}</span></div><div class="bar2" style="margin-top:8px"><i data-w="${Math.min(100,(lastA??0)/GOAL*100)}"></i></div></div>
  </div>
  <div class="rail" id="rail">${cards}</div>
  <div class="dots">${pt.map((_,j)=>`<button class="dot ${j===0?'on':''}" data-d="${j}" aria-label="Report ${j+1}"></button>`).join('')}</div>`;
}
function railInit(rail){
  const slides=[...rail.children],dots=$$('.dots [data-d]');
  const update=()=>{
    const rc=rail.getBoundingClientRect(),mid=rc.left+rc.width/2;
    let best=0,bd=1e9;
    slides.forEach((s,j)=>{
      const r=s.getBoundingClientRect(),d=Math.min(Math.abs(r.left+r.width/2-mid)/rc.width,1);
      s.style.transform=`scale(${1-d*.07})`;s.style.opacity=1-d*.55;
      if(d<bd){bd=d;best=j;}
    });
    dots.forEach((x,j)=>x.classList.toggle('on',j===best));
  };
  rail.addEventListener('scroll',()=>requestAnimationFrame(update),{passive:true});
  dots.forEach((d,j)=>d.onclick=()=>rail.scrollTo({left:slides[j].offsetLeft-rail.offsetLeft-16,behavior:'smooth'}));
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.55)e.target.classList.add('in');}),{root:rail,threshold:[0,.55,1]});
  slides.forEach(s=>io.observe(s));
  update();
  $$('[data-print]').forEach(b=>b.onclick=()=>{
    const s=b.closest('.slide');
    document.body.classList.add('one');s.classList.add('printing');
    window.print();
  });
}
window.addEventListener('afterprint',()=>{document.body.classList.remove('one');$$('.printing').forEach(x=>x.classList.remove('printing'));});

function bindTeacher(a){
  $$('[data-score]').forEach(inp=>inp.onchange=()=>{

    k.marks[CUR]=k.marks[CUR]||{};

    const [cid,s]=b.dataset.submit.split('|');const c=DB.classes.find(x=>x.id===cid);

    DB.subm[cid+':'+CUR+':'+s]=true;save();toast(subjName(s)+' submitted');route();
  });
  $$('[data-sample]').forEach(b=>b.onclick=()=>{
    const [cid,s]=b.dataset.sample.split('|');const c=DB.classes.find(x=>x.id===cid);
    classKids(c).forEach(k=>{k.marks[CUR]=k.marks[CUR]||{};if(k.marks[CUR][s]==null)k.marks[CUR][s]=50+Math.round(Math.random()*40);});
    save();toast('Sample marks filled');route();

  const wrap=$('[data-cid]');

    </div>`).join('')||'<p class="mut">No approved teachers yet.</p>'}</div>
    <div class="card" style="margin-top:14px"><h2>Classes</h2>${DB.classes.map(c=>`<div class="rowline"><div class="row sp"><b>${esc(c.name)}</b><span class="mut" style="font-size:.8rem">${classKids(c).length} students</span></div><div class="row" style="margin-top:6px">${c.subj.map(s=>`<span class="chip">${esc(subjName(s))}</span>`).join('')||'<span class="mut" style="font-size:.82rem">No subjects yet</span>'}</div></div>`).join('')}
      <div class="row" style="margin-top:12px"><input id="newcls" placeholder="New class name" style="flex:1"><button class="sm" id="mkcls">Create class</button></div></div>`;
  }else if(U.otab==='requests'){
    const inbox=open.length?open.map(i=>`<div class="msg"><span class="chip ${i.type==='absence'?'flag':'k'}">${i.type}</span><div style="flex:1"><div>${esc(kidBy(i.kid).name)} · ${esc(i.text)}</div><div class="mut" style="font-size:.8rem">${i.d}</div></div><button class="ghost sm" data-done="${i.id}">Done</button></div>`).join(''):'<p class="mut">Inbox clear.</p>';
    const slipRows=SLIPS.map(s=>{const yes=K.filter(k=>(DB.consents[k.id+':'+s.id]||{}).status==='yes').length;return `<tr class="hl"><td>${esc(s.title)}</td><td>${yes} / ${K.length} approved</td></tr>`;}).join('');
    const medRows=K.filter(k=>DB.med[k.id]).map(k=>`<tr class="hl"><td>${esc(k.name)}</td><td>${esc(DB.med[k.id].allergies||'None')}</td><td>${esc(DB.med[k.id].emergency||'')}</td></tr>`).join('')||'<tr><td colspan="3" class="mut">No updates yet.</td></tr>';
    body=`<div class="grid2"><div class="card"><h2>Inbox</h2>${inbox}</div><div class="card"><h2>Permission slips</h2><table>${slipRows}</table></div></div>
    <div class="card" style="margin-top:14px"><h2>Medical updates</h2><div style="overflow-x:auto"><table><tr><th>Student</th><th>Allergies</th><th>Emergency</th></tr>${medRows}</table></div></div>`;
  }else{
    const cnt=v=>K.filter(k=>DB.year[k.id]===v).length;
    const yr=K.map(k=>`<tr class="hl"><td>${esc(k.name)}</td><td>${esc(classOf(k).name)}</td><td>${avgT(k,1)??'–'}%</td><td><select data-y="${k.id}">${[['promote','Promote'],['repeat','Repeat'],['transfer','Transfer out']].map(([v,l])=>`<option value="${v}" ${DB.year[k.id]===v?'selected':''}>${l}</option>`).join('')}</select></td></tr>`).join('');
    body=`<div class="card"><div class="row sp" style="margin-bottom:10px"><h2 style="margin:0">Year-end</h2><span class="chip">${cnt('promote')} promote · ${cnt('repeat')} repeat · ${cnt('transfer')} transfer</span></div>
      <div style="overflow-x:auto"><table><tr><th>Student</th><th>Class</th><th>T2</th><th>Decision</th></tr>${yr}</table></div></div>
      <div class="card dark" style="margin-top:14px"><h2>Notify families</h2>
      <div class="row" style="margin:4px 0 14px;gap:14px"><label class="mut"><input type="checkbox" id="c1" checked> App</label><label class="mut"><input type="checkbox" id="c2" checked> SMS</label><label class="mut"><input type="checkbox" id="c3" checked> WhatsApp</label></div>
      <button class="g" id="send">Notify ${published.length} families</button></div>`;
  }
  page(`<div class="head"><div><div class="eyebrow">School office</div><h1>${titles[U.otab]}</h1></div></div>${body}`);
  $$('[data-y]').forEach(s=>s.onchange=()=>{DB.year[s.dataset.y]=s.value;save();toast('Decision saved');});
  $$('[data-done]').forEach(b=>b.onclick=()=>{const it=DB.inbox.find(x=>String(x.id)===b.dataset.done);if(it)it.done=true;save();route();});
  $$('[data-publish]').forEach(b=>b.onclick=()=>{
    const c=DB.classes.find(x=>x.id===b.dataset.publish);
    const kids=classKids(c);
    kids.forEach(k=>{k.pub[CUR]=1;});
    const ranked=kids.map(k=>({k,a:avgOf(k,CUR,c.subj)??0})).sort((x,y)=>y.a-x.a);
    ranked.forEach((r,i)=>{r.k.pos[CUR]=i+1;});
    kids.forEach(k=>DB.msgs.unshift({ch:'App',kid:k.id,t:`${TERMS[CUR]} report card is ready`,d:'Just now'}));
    DB.rstat[c.id+':'+CUR]='published';save();toast(c.name+' published');route();
  });
  $$('[data-return]').forEach(b=>b.onclick=()=>{const c=DB.classes.find(x=>x.id===b.dataset.return);DB.rstat[c.id+':'+CUR]='open';save();toast('Returned to class teacher');route();});
  $$('[data-approve]').forEach(b=>b.onclick=()=>{const t=DB.accounts.find(x=>x.phone===b.dataset.approve);t.status='active';t.assign=t.assign||[];save();toast(t.name+' approved');route();});
  $$('[data-assign]').forEach(b=>b.onclick=()=>{
    const t=DB.accounts.find(x=>x.phone===b.dataset.assign);
    const cls=document.querySelector(`[data-cls-for="${t.phone}"]`).value;
    const role=document.querySelector(`[data-role-for="${t.phone}"]`).value||null;
    const c=DB.classes.find(x=>x.id===cls);
    t.assign=t.assign||[];
    if(role===null){
      DB.accounts.forEach(x=>{if(x.assign)x.assign=x.assign.filter(y=>!(y.cls===cls&&!y.subj));});
      t.assign.push({cls,subj:null});
    }else{
      if(!c.subj.includes(role))c.subj.push(role);
      DB.accounts.forEach(x=>{if(x.assign)x.assign=x.assign.filter(y=>!(y.cls===cls&&y.subj===role));});
      t.assign.push({cls,subj:role});
    }
    save();toast('Assigned');route();
  });
  $$('[data-unassign]').forEach(b=>b.onclick=()=>{const [ph,i]=b.dataset.unassign.split('|');const t=DB.accounts.find(x=>x.phone===ph);t.assign.splice(+i,1);save();toast('Removed');route();});
  const mk=$('#mkcls');
  if(mk)mk.onclick=()=>{const n=$('#newcls').value.trim();if(!n)return toast('Enter a class name');DB.classes.push({id:'C'+Date.now(),name:n,subj:[]});save();toast('Class created');route();};
  const sd=$('#send');
  if(sd)sd.onclick=()=>{
    const ch=['App','SMS','WhatsApp'].filter((c,i)=>$('#c'+(i+1)).checked);
    if(!ch.length)return toast('Choose a channel');
    published.forEach(k=>ch.forEach(c=>DB.msgs.unshift({ch:c,kid:k.id,t:'Term 3 report card is ready',d:'Just now'})));
    save();toast('Notified '+published.length+' families via '+ch.join(', '));route();
  };
  afterRender();
}

route();
</script>
</body>
</html>
